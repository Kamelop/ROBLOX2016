name: iOS Studio Device Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-studio-device-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-engine:
    name: Build iOS engine foundation (device arm64)
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project schemes
        run: xcodebuild -list -project iOS/RobloxMobile.xcodeproj

      # App Studio is a desktop/macOS library scheme. App iOS is the
      # iOS-specific engine scheme; build it for physical-device arm64.
      - name: Build iOS engine for iPad and iPhone
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project iOS/RobloxMobile.xcodeproj \
            -scheme "App iOS" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/ios-device-build.log

      - name: Upload device engine build and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-ios-engine-arm64-foundation
          path: |
            build/DerivedData/Build/Products/Debug-iphoneos/*.a
            build/ios-device-build.log
          if-no-files-found: warn
          retention-days: 14
