name: iOS Studio Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-studio:
    name: Build Roblox Studio for iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project schemes
        run: xcodebuild -list -project iOS/RobloxMobile.xcodeproj

      - name: Build Studio scheme
        run: |
          set -o pipefail
          xcodebuild \
            -project iOS/RobloxMobile.xcodeproj \
            -scheme "App Studio" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/ios-studio-build.log

      - name: Upload simulator app and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-studio-ios-simulator
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
            build/ios-studio-build.log
          if-no-files-found: warn
          retention-days: 14
